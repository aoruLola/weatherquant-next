[project]
name = "weatherquant-next"
version = "0.1.3"
description = "WeatherQuant Next - reproducible quantitative research core for Polymarket weather prediction markets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "httpx>=0.27,<1",
    "duckdb>=1.1,<2",
    "numpy>=1.26,<3",
    "scipy>=1.13,<2",
    "pandas>=2.2,<3",
    "pytz>=2024.1",
    "websockets>=14,<16",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.scripts]
weatherquant-collect = "weatherquant.data.worker:worker_main"
weatherquant-research = "weatherquant.cli:main"
weatherquant-shadow = "weatherquant.shadow.cli:main"
weatherquant-dashboard = "weatherquant.dashboard.api:main"
weatherquant-mcp = "weatherquant.mcp.main:main"

[project.optional-dependencies]
# Filled in after the official-SDK audit (docs/open-source-review.md).
# Kept out of the base install until a read-only capability is actually wired up.
polymarket = []

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
    # Repeated from the `mcp` group so the root CI actually runs the gateway
    # tests rather than skipping them. Safe to repeat: `dev` is never
    # installed into an image (they all use --no-dev), so this cannot widen
    # what the collector, shadow or dashboard containers contain.
    "mcp>=2.3,<3",
]
# Dashboard API only. Kept OUT of the default and `dev` groups on purpose:
# the collector and shadow images run `uv sync --frozen --no-dev`, so a
# dependency that lives here can never leak into the two production images,
# and the root CI (`--group dev`) never installs it either - which is why the
# dashboard's own tests live under dashboard/tests/ and not under tests/.
dashboard = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

# MCP gateway only, for the same reason as above and then some: this group
# pulls in an SDK that speaks to outside clients, and it must never end up
# inside an image that collects markets or evaluates decisions. The gateway
# is its own container with its own lockstep - see
# docs/performance-data-contract.md section 12.
mcp = [
    "mcp>=2.3,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weatherquant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Project-local temp root: the OS temp directory is not writable on some hosts.
addopts = "--basetemp=.pytest_tmp"
filterwarnings = ["ignore::DeprecationWarning"]
# If a single test wedges, dump every live thread's traceback instead of
# letting the job die silently at its 15-minute ceiling. Main CI has hung
# twice at ~53% with no output for 14 minutes and the log could not name the
# culprit (-q prints a dot per test, not a name). 600s is far above any
# honest test here - the whole suite runs in ~127s - so a dump means a hang.
faulthandler_timeout = 600

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["F", "E", "B", "W", "I", "UP", "SIM", "RUF"]
ignore = [
    "E501",   # line length is handled by the formatter
    "SIM108", # ternaries are often less readable than the branch
]

# Declare first-party explicitly rather than relying on ruff inferring it from
# `src`. The inference resolved differently between a Windows checkout and the
# CI runner: CI treated `weatherquant` as third-party, collapsed the blank line
# after `import pytest`, and failed I001 on six test files while the identical
# bytes passed locally. Naming the package removes the ambiguity.
[tool.ruff.lint.isort]
known-first-party = ["weatherquant"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
# This script emits Chinese markdown. Fullwidth punctuation (：，（）×｜) is
# correct typography there, not an ASCII look-alike typo - RUF001 exists to
# catch characters that *resemble* ASCII, which is exactly wrong for CJK prose.
"scripts/forecast_coverage.py" = ["RUF001"]
# Same reason as forecast_coverage: emits Chinese markdown.
"scripts/baseline_report.py" = ["RUF001"]
# Tool descriptions are written in Chinese for the clients that read them,
# so fullwidth punctuation is the typography, not an ASCII look-alike.
"src/weatherquant/mcp/server.py" = ["RUF001"]

[tool.ruff.format]
quote-style = "double"
