[project]
name = "weatherquant-next"
version = "0.1.1"
description = "WeatherQuant Next - reproducible quantitative research core for Polymarket weather prediction markets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "httpx>=0.27,<1",
    "duckdb>=1.1,<2",
    "numpy>=1.26,<3",
    "scipy>=1.13,<2",
    "pandas>=2.2,<3",
    "pytz>=2024.1",
    "websockets>=14,<16",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.scripts]
weatherquant-collect = "weatherquant.data.worker:worker_main"
weatherquant-research = "weatherquant.cli:main"

[project.optional-dependencies]
# Filled in after the official-SDK audit (docs/open-source-review.md).
# Kept out of the base install until a read-only capability is actually wired up.
polymarket = []

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weatherquant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Project-local temp root: the OS temp directory is not writable on some hosts.
addopts = "--basetemp=.pytest_tmp"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["F", "E", "B", "W", "I", "UP", "SIM", "RUF"]
ignore = [
    "E501",   # line length is handled by the formatter
    "SIM108", # ternaries are often less readable than the branch
]

# Declare first-party explicitly rather than relying on ruff inferring it from
# `src`. The inference resolved differently between a Windows checkout and the
# CI runner: CI treated `weatherquant` as third-party, collapsed the blank line
# after `import pytest`, and failed I001 on six test files while the identical
# bytes passed locally. Naming the package removes the ambiguity.
[tool.ruff.lint.isort]
known-first-party = ["weatherquant"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
# This script emits Chinese markdown. Fullwidth punctuation (：，（）×｜) is
# correct typography there, not an ASCII look-alike typo - RUF001 exists to
# catch characters that *resemble* ASCII, which is exactly wrong for CJK prose.
"scripts/forecast_coverage.py" = ["RUF001"]

[tool.ruff.format]
quote-style = "double"
