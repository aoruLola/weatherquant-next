# Development CI: test and build only.
#
# This workflow deliberately never pushes an image. Publishing is reserved for
# the release workflow, so an ordinary commit to a development branch can never
# move the tag the NAS pulls - which is the whole point of separating them.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: write   # Docker layer cache (cache-to: type=gha)

jobs:
  lint-and-test:
    outputs:
      build_image: ${{ steps.image.outputs.build_image }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check image inputs on the PR merge commit
        id: image
        run: bash scripts/ci_image_gate.sh collector >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen --group dev

      - name: Ruff
        run: |
          uv run ruff --version
          if ! uv run ruff check . ; then
            echo ""
            echo "--- ruff's intended fix (diff) ---"
            uv run ruff check . --diff || true
            exit 1
          fi

      - name: Pytest
        run: uv run pytest -q --cov=weatherquant --cov-report=term-missing

  build-image:
    if: needs.lint-and-test.outputs.build_image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: weatherquant-next:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container starts and reports health
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wq-data"
          # The image runs as uid 1000, and a bind mount masks the chown done
          # inside the image - so the host directory must match first.
          sudo chown -R 1000:1000 "$RUNNER_TEMP/wq-data"
          docker run -d --name wq-ci \
            -v "$RUNNER_TEMP/wq-data:/data" \
            -e WQ_DB_PATH=/data/weatherquant.duckdb \
            -e WQ_RAW_DIR=/data/raw \
            -e WQ_DISK_WARN_PERCENT=10 \
            -e WQ_DISK_CRITICAL_PERCENT=3 \
            weatherquant-next:ci

          echo "waiting for the collector to publish a heartbeat..."
          ok=0
          for i in $(seq 1 60); do
            if docker exec wq-ci test -f /data/health/heartbeat.json 2>/dev/null; then
              echo "heartbeat present after ${i}s"
              ok=1
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' wq-ci 2>/dev/null)" != "true" ]; then
              echo "container exited early"
              break
            fi
            sleep 1
          done

          if [ "$ok" != "1" ]; then
            echo "--- container logs ---"
            docker logs wq-ci 2>&1 | tail -60 || true
            echo "--- container state ---"
            docker inspect wq-ci --format '{{.State.Status}} exit={{.State.ExitCode}} err={{.State.Error}}' || true
            echo "--- image smoke test (entrypoint bypassed) ---"
            docker run --rm --entrypoint python weatherquant-next:ci               -c "import weatherquant, weatherquant.data.worker as w; print('import ok', weatherquant.__version__)" || true
            echo "--- image smoke test (entrypoint as-is) ---"
            docker run --rm weatherquant-next:ci --help 2>&1 | tail -20 || true
            exit 1
          fi
          docker exec wq-ci test -f /data/health/heartbeat.json

          echo "--- graceful stop ---"
          docker stop -t 60 wq-ci
          docker logs wq-ci 2>&1 | tail -20

          echo "--- database survived the restart ---"
          test -f "$RUNNER_TEMP/wq-data/weatherquant.duckdb"
          docker rm wq-ci
