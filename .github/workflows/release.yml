# Release: test, build, verify, publish.
#
# Release tags move only after the registry artifact passes verification:
#
#   pytest + ruff  ->  docker build  ->  container start + health check
#                  ->  push digest  ->  verify worker  ->  publish tags
#
# `stable` is only ever moved by this workflow, on a run where every gate
# passed. Development pushes never touch it, so the NAS - which tracks
# `stable` - can only ever update to something that was built and health-checked
# as a unit. Rolling back means pointing the stack at a previous SHA tag,
# which is never rewritten.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      reason:
        description: Why this release is being cut
        required: false

permissions:
  contents: read
  packages: write
  actions: write   # Docker layer cache (cache-to: type=gha)

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify the release commit is on main
        id: source
        run: |
          git merge-base --is-ancestor HEAD origin/main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen --group dev

      - name: Ruff
        run: uv run ruff check .

      - name: Pytest
        run: uv run pytest -q

      - name: Build linux/amd64
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: weatherquant-next:release-candidate
          build-args: GIT_SHA=${{ steps.source.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container start, collect, health-check, graceful stop, restart
        id: soak
        run: |
          set -euo pipefail
          DATA="$RUNNER_TEMP/wq-data"
          mkdir -p "$DATA"
          # The image runs as uid 1000, and a bind mount masks the chown done
          # inside the image - so the host directory must match first.
          sudo chown -R 1000:1000 "$DATA"

          docker run -d --name wq-release             -v "$DATA:/data"             -e WQ_DB_PATH=/data/weatherquant.duckdb             -e WQ_RAW_DIR=/data/raw             -e WQ_LOG_LEVEL=INFO             -e WQ_DISK_WARN_PERCENT=10             -e WQ_DISK_CRITICAL_PERCENT=3             weatherquant-next:release-candidate

          echo "waiting for heartbeat..."
          for i in $(seq 1 90); do
            if docker exec wq-release test -f /data/health/heartbeat.json; then break; fi
            sleep 1
          done
          docker exec wq-release test -f /data/health/heartbeat.json

          echo "waiting for the first discovery cycle..."
          sleep 60

          echo "--- healthcheck ---"
          docker exec wq-release python /usr/local/bin/healthcheck.py

          echo "--- runs as non-root ---"
          uid="$(docker exec wq-release id -u)"
          echo "uid=$uid"
          test "$uid" != "0"

          echo "--- graceful stop ---"
          docker stop -t 60 wq-release

          # Everything below starts a container against the SAME volume, so it
          # must happen only after the collector has released its
          # single-instance lock. Doing it while the writer is live would be
          # refused with exit 4 and fail the job for the wrong reason.
          # NOTE: the image sets ENTRYPOINT ["weatherquant-collect"], so any
          # command meant for a different program needs --entrypoint. Without it
          # `python -c ...` is passed to weatherquant-collect as its own argv and
          # the collector exits 2 on an argparse error. tests/test_workflows.py
          # asserts this for every docker run in both workflows.
          echo "--- collected real public data ---"
          docker run --rm --entrypoint python -v "$DATA:/data" weatherquant-next:release-candidate -c "import duckdb,sys; con=duckdb.connect('/data/weatherquant.duckdb',read_only=True); m=con.execute('SELECT COUNT(*) FROM markets').fetchone()[0]; b=con.execute('SELECT COUNT(*) FROM order_books').fetchone()[0]; con.close(); print(f'markets={m} books={b}'); sys.exit(0 if (m>=1 and b>=1) else 'collector produced no data - refusing to publish')"

          echo "--- restart must NOT reinitialise the database ---"
          before=$(stat -c %s "$DATA/weatherquant.duckdb")
          docker run --rm --entrypoint python -v "$DATA:/data" weatherquant-next:release-candidate -c "import duckdb,sys; c=duckdb.connect('/data/weatherquant.duckdb',read_only=True); n=c.execute('SELECT COUNT(*) FROM schema_migrations').fetchone()[0]; m=c.execute('SELECT COUNT(*) FROM markets').fetchone()[0]; c.close(); print(f'migrations={n} markets={m}'); sys.exit(0 if (n>=4 and m>=1) else 'database was reinitialised - refusing to publish')"
          after=$(stat -c %s "$DATA/weatherquant.duckdb")
          echo "size before=$before after=$after"

          echo "--- a fresh start must not wipe what was collected ---"
          docker run --rm --entrypoint python -v "$DATA:/data" weatherquant-next:release-candidate -c "import duckdb,sys; c=duckdb.connect('/data/weatherquant.duckdb',read_only=True); b=c.execute('SELECT COUNT(*) FROM order_books').fetchone()[0]; c.close(); print('order_books after restart:', b); sys.exit(0 if b>=1 else 'rows lost on restart')"

          docker rm wq-release || true

      - name: Image must run as non-root
        run: |
          set -euo pipefail
          uid=$(docker run --rm --entrypoint id weatherquant-next:release-candidate -u)
          echo "uid=$uid"
          test "$uid" != "0"

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    # GitHub auto-creates the `release` environment on first reference. Adding a
    # required reviewer there gates the publish step behind a human click - a
    # cheap guard for the one job that moves the tag the NAS tracks.
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase the image name
        run: echo "IMAGE=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: GIT_SHA=${{ needs.verify.outputs.sha }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the published worker and promote its digest
        env:
          SOURCE_SHA: ${{ needs.verify.outputs.sha }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          repo="$REGISTRY/$IMAGE"
          ref="$repo@$DIGEST"
          docker pull "$ref"
          bash scripts/verify_worker_image.sh "$ref" "$SOURCE_SHA"
          docker buildx imagetools create -t "$repo:sha-$SOURCE_SHA" -t "$repo:$GITHUB_REF_NAME" "$ref"
          docker buildx imagetools create -t "$repo:stable" "$ref"
          echo "Collector $SOURCE_SHA ($GITHUB_REF_NAME, stable) verified at $ref" >> "$GITHUB_STEP_SUMMARY"
