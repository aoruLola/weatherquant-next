# Release: test, build, verify, publish - dashboard only.
#
# Ordering is the safety property, copied from release.yml's shape:
#
#   backend + frontend tests  ->  browser acceptance  ->  docker build
#      ->  container acceptance (the SAME script dashboard-ci uses)
#      ->  push sha-<commit> + dashboard-vX.Y.Z  ->  move `dashboard-stable`
#
# Tags this workflow may touch exist in exactly one namespace:
#   ghcr.io/aorulola/weatherquant-next-dashboard:{dashboard-*, sha-*}
# It can never move the collector's `stable` or the shadow's `shadow-stable` -
# different image repository entirely, asserted by tests/test_dashboard_ci.py.
#
# `dashboard-stable` is only moved by this workflow, on a run where every gate
# passed, so the NAS - which tracks `dashboard-stable` - can only ever update
# to something that was built, browser-tested and health-checked as a unit.

name: dashboard-release

on:
  push:
    tags: ["dashboard-v*"]
  workflow_dispatch:
    inputs:
      reason:
        description: Why this release is being cut
        required: false

permissions:
  contents: read
  packages: write
  actions: write   # Docker layer cache (cache-to: type=gha)

concurrency:
  group: dashboard-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-dashboard

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Same reason as shadow-release: the dashboard image identifies itself by
      # this file, and a tag that disagrees with it makes every deployment
      # indistinguishable from the one it replaced.
      - name: Release tag must match pyproject version
        if: startsWith(github.ref, 'refs/tags/dashboard-v')
        run: |
          set -euo pipefail
          tagged="${GITHUB_REF_NAME#dashboard-v}"
          declared="$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)"
          echo "tag dashboard-v${tagged} vs pyproject ${declared}"
          if [ "${tagged}" != "${declared}" ]; then
            echo "::error::dashboard-v${tagged} is tagged on pyproject version ${declared}."
            echo "::error::Set version = \"${tagged}\" and commit before tagging."
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen --group dev --group dashboard

      - name: Ruff
        run: uv run ruff check .

      - name: Pytest (dashboard + workflow invariants)
        run: uv run pytest -q dashboard/tests tests/test_workflows.py tests/test_dashboard_ci.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/frontend/package-lock.json

      - name: Frontend typecheck + unit tests + build
        working-directory: dashboard/frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Generate fixture dataset
        run: uv run python dashboard/fixtures/generate.py

      - name: Browser acceptance before anything is pushed
        working-directory: dashboard/frontend
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Build linux/amd64
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dashboard
          platforms: linux/amd64
          push: false
          load: true
          tags: weatherquant-dashboard:release-candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container acceptance (shared script)
        run: bash scripts/dashboard_docker_accept.sh weatherquant-dashboard:release-candidate

      - name: Collect logs on failure
        if: failure()
        run: docker logs wq-dashboard-accept || true

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    # GitHub auto-creates the environment on first reference; adding a required
    # reviewer gates the publish behind a human click - a cheap guard for the
    # job that moves the tag the NAS tracks.
    environment: dashboard-release
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase the image name
        run: echo "IMAGE=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Extract metadata
        id: meta
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA}"
          # Tags come from the ref: a tag push publishes its own version tag;
          # a manual dispatch publishes a non-versioned dashboard-dev tag
          # (never `stable`, which only a versioned release may move).
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="dashboard-dev-${sha:0:12}"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${sha}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (immutable SHA tag + version tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dashboard
          platforms: linux/amd64
          push: true
          provenance: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:sha-${{ steps.meta.outputs.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Move dashboard-stable (only after the SHA tag exists)
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "$REGISTRY/$IMAGE:dashboard-stable" \
            "$REGISTRY/$IMAGE:sha-${{ steps.meta.outputs.sha }}"
          echo "dashboard-stable -> sha-${{ steps.meta.outputs.sha }}"

      - name: Provenance summary
        run: |
          echo "Published:" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`$REGISTRY/$IMAGE:sha-${{ steps.meta.outputs.sha }}\` (immutable)" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`$REGISTRY/$IMAGE:${{ steps.meta.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "- \`$REGISTRY/$IMAGE:dashboard-stable\` (moved from the SHA tag)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "This workflow cannot move the collector's or the shadow's tags:" >> "$GITHUB_STEP_SUMMARY"
          echo "those are different image repositories (\`weatherquant-next\`, \`weatherquant-next-shadow\`)." >> "$GITHUB_STEP_SUMMARY"
