# Development CI for the shadow engine: test and build only.
#
# Deliberately never pushes an image. Publishing is reserved for
# shadow-release.yml, so an ordinary commit cannot move `shadow-stable` - and
# this workflow cannot move the *collector's* tags either, because it builds
# `Dockerfile.shadow` under a different name and has no GHCR login at all.
#
# The container checks below are the offline acceptance list from the spec:
# non-root, health, data-directory permissions, restart retention, the
# single-instance lease, a read-only collector mount, and SIGTERM.

name: shadow-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: write   # Docker layer cache (cache-to: type=gha)

jobs:
  shadow-tests:
    outputs:
      build_image: ${{ steps.image.outputs.build_image }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check image inputs on the PR merge commit
        id: image
        run: bash scripts/ci_image_gate.sh shadow >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen --group dev

      - name: Ruff
        run: uv run ruff check .

      - name: Pytest (shadow modules)
        run: uv run pytest -q tests/test_shadow_models.py tests/test_shadow_storage.py tests/test_shadow_ingest.py tests/test_shadow_forecast.py tests/test_shadow_decision.py tests/test_shadow_runner.py

      - name: Model artifacts are present and pinned
        run: |
          test -f models/manifest.json
          uv run python -c "from weatherquant.models.artifacts import load_manifest; print(load_manifest('models'))"

  build-shadow-image:
    if: needs.shadow-tests.outputs.build_image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: shadow-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.shadow
          platforms: linux/amd64
          push: false
          load: true
          tags: weatherquant-shadow:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container starts and reports health
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shadow-data" "$RUNNER_TEMP/collector-raw/gamma"

          # A minimal read-only archive for the shadow to tail. Envelope shape
          # matches data/archive.py exactly.
          #
          # Written BEFORE the chown. This job runs as uid 1001 and a directory
          # handed to uid 1000 is no longer one it can create files in - which
          # is exactly how the first run of this workflow failed. The image runs
          # as uid 1000 and a bind mount masks the chown done inside it, so the
          # host paths still have to be re-owned afterwards.
          printf '%s\n' '{"archive_seq":1,"source":"gamma","received_at_utc":"2026-10-11T12:00:00+00:00","venue_ts_utc":null,"venue_ts_origin":"missing","quality":"ok","run_id":"ci","payload":{"id":"ci-event","title":"probe","markets":[]}}' \
            > "$RUNNER_TEMP/collector-raw/gamma/2026-10-11.jsonl"

          sudo chown -R 1000:1000 "$RUNNER_TEMP/shadow-data" "$RUNNER_TEMP/collector-raw"

          docker run -d --name shadow-ci \
            -v "$RUNNER_TEMP/shadow-data:/data" \
            -v "$RUNNER_TEMP/collector-raw:/collector-raw:ro" \
            -e WQ_SHADOW_HEALTH_DIR=/data/health \
            -e WQ_DISK_WARN_PERCENT=10 \
            -e WQ_DISK_CRITICAL_PERCENT=3 \
            weatherquant-shadow:ci

          # Wait for the heartbeat FILE, not for exit code 0: the probe exits 0
          # for "starting" too, so looping on it stops before the engine has
          # written anything - which is how the first run passed its health
          # step and then failed the very next assertion.
          for i in $(seq 1 60); do
            if docker exec shadow-ci test -f /data/health/heartbeat.json; then
              break
            fi
            sleep 2
          done
          docker exec shadow-ci test -f /data/health/heartbeat.json
          echo "heartbeat present"

          # Now the probe itself; healthy or degraded both exit 0, and either
          # means the engine is up and reporting.
          docker exec shadow-ci python /usr/local/bin/healthcheck.py
          echo "health OK"

      - name: Runs as a non-root user
        run: |
          set -euo pipefail
          uid=$(docker exec shadow-ci id -u)
          echo "uid=$uid"
          test "$uid" != "0"

      - name: Data directory is writable by the container user
        run: |
          set -euo pipefail
          docker exec shadow-ci sh -c 'touch /data/.write-probe && rm /data/.write-probe'
          test -f "$RUNNER_TEMP/shadow-data/health/heartbeat.json"

      - name: Report is callable while the engine holds the database
        run: |
          set -euo pipefail
          # The bug this guards: `report` used to open shadow.duckdb itself,
          # and DuckDB refuses the file to a second process even read-only -
          # so the one command an operator runs WHILE the engine is up was the
          # one command that could not run. Ten calls, against a live engine,
          # must all succeed.
          before=$(docker exec shadow-ci python -c "import json;print(json.load(open('/data/health/heartbeat.json'))['updated_at_utc'])")

          for i in $(seq 1 10); do
            docker exec shadow-ci weatherquant-shadow report --json > "$RUNNER_TEMP/report.$i.json"
            docker exec shadow-ci weatherquant-shadow report > "$RUNNER_TEMP/report.$i.txt"
            python3 -c "
          import json, sys
          d = json.load(open('$RUNNER_TEMP/report.$i.json'))
          assert d.get('generated_at_utc'), 'snapshot has no generation time'
          assert d.get('source') == 'shadow-main', 'expected the published snapshot, got ' + str(d.get('source'))
          assert 'decisions' in d, 'no decisions block'
          print('  call $i ok: generated=%s evaluated=%s stale=%s' % (
              d['generated_at_utc'], d['decisions']['evaluated'], d.get('stale')))
          "
          done

          # The engine must have kept working throughout: heartbeat advances.
          sleep 12
          after=$(docker exec shadow-ci python -c "import json;print(json.load(open('/data/health/heartbeat.json'))['updated_at_utc'])")
          echo "heartbeat before: $before"
          echo "heartbeat after : $after"
          if [ "$after" = "$before" ]; then
            echo "the engine stopped writing while report was being called" >&2
            exit 1
          fi

          # And the snapshot really is a file on the shared volume, readable
          # from the host (mkstemp would otherwise leave it 0600).
          test -f "$RUNNER_TEMP/shadow-data/reports/report.json"
          python3 -c "import json; json.load(open('$RUNNER_TEMP/shadow-data/reports/report.json'))"
          echo "host can read the published snapshot"

      - name: Read-only collector mount cannot be written through
        run: |
          set -euo pipefail
          before=$(sha256sum "$RUNNER_TEMP/collector-raw/gamma/2026-10-11.jsonl")
          if docker exec shadow-ci sh -c 'echo nope >> /collector-raw/gamma/2026-10-11.jsonl' 2>/dev/null; then
            echo "wrote to a read-only mount" >&2
            exit 1
          fi
          after=$(sha256sum "$RUNNER_TEMP/collector-raw/gamma/2026-10-11.jsonl")
          test "$before" = "$after"
          echo "collector archive untouched"

      - name: Single-instance lease refuses a second writer with exit code 4
        run: |
          set -euo pipefail
          set +e
          docker run --rm \
            -v "$RUNNER_TEMP/shadow-data:/data" \
            -v "$RUNNER_TEMP/collector-raw:/collector-raw:ro" \
            -e WQ_SHADOW_HEALTH_DIR=/data/health \
            -e WQ_DISK_WARN_PERCENT=10 \
            weatherquant-shadow:ci run --once
          code=$?
          set -e
          echo "second instance exit code: $code"
          test "$code" -eq 4

      - name: SIGTERM is handled gracefully and state survives a restart
        run: |
          set -euo pipefail
          docker stop -t 60 shadow-ci
          test -f "$RUNNER_TEMP/shadow-data/shadow/shadow.duckdb"
          status=$(python3 -c "import json;print(json.load(open('$RUNNER_TEMP/shadow-data/health/heartbeat.json'))['status'])")
          echo "status after stop: $status"
          test "$status" = "stopped" -o "$status" = "failed"

          # Restart against the same volume: the database must still be there.
          docker run -d --name shadow-restart \
            -v "$RUNNER_TEMP/shadow-data:/data" \
            -v "$RUNNER_TEMP/collector-raw:/collector-raw:ro" \
            -e WQ_SHADOW_HEALTH_DIR=/data/health \
            -e WQ_DISK_WARN_PERCENT=10 \
            weatherquant-shadow:ci
          sleep 5
          docker exec shadow-restart python /usr/local/bin/healthcheck.py

      - name: The shadow database is a real shadow database
        run: |
          set -euo pipefail
          docker stop -t 60 shadow-restart
          docker run --rm --entrypoint python \
            -v "$RUNNER_TEMP/shadow-data:/data" \
            -e WQ_SHADOW_DB_PATH=/data/shadow/shadow.duckdb \
            weatherquant-shadow:ci -c "
          import duckdb, sys
          con = duckdb.connect('/data/shadow/shadow.duckdb', read_only=True)
          tables = {r[0] for r in con.execute(\"SELECT table_name FROM information_schema.tables WHERE table_schema='main'\").fetchall()}
          con.close()
          required = {'shadow_decisions', 'market_catalog', 'ingest_checkpoints'}
          missing = required - tables
          if missing:
              print('missing tables:', missing, file=sys.stderr)
              sys.exit(1)
          print('tables OK:', sorted(tables))
          "

      - name: Collect logs on failure
        if: failure()
        run: docker logs shadow-ci || true

  # Development CI builds but never publishes. This job asserts that of the
  # file itself, so an accidental login step fails loudly instead of quietly
  # moving a tag the NAS pulls.
  shadow-ci-never-publishes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: No registry login in the development workflow
        run: |
          set -euo pipefail
          # Searching this file for a string you have just written down finds
          # nothing but your own check - that is how the first run of this job
          # failed. Lines that ARE this check carry "grep -nE" and are dropped
          # before anything is judged.
          hits=$(grep -nE "uses: docker/login-action|push: true|packages: write|imagetools create" \
                   .github/workflows/shadow-ci.yml | grep -v "grep -nE" || true)
          if [ -n "$hits" ]; then
            echo "shadow-ci must not publish anything:" >&2
            echo "$hits" >&2
            exit 1
          fi
          echo "no publish capability: no login, no push:true, no packages:write, no tag move"
