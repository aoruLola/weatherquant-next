# WeatherQuant Next - Unraid Compose Manager Plus stack
#
# See docs/unraid-collector-deployment.md for the full walkthrough. This file
# is the artefact that file documents; they are written to be used together.
#
# Three properties are deliberate and easy to break by editing:
#
#   1. NO `ports:`. The collector makes outbound requests only. Publishing a
#      port would expose the DuckDB file's directory through no service at all.
#   2. ONE replica, enforced by the single-instance lock as well as by compose.
#      Two writers against one DuckDB file is the failure mode the lock exists
#      to prevent; the lock is the real guard, this is the first line.
#   3. `stop_grace_period` above the collector's flush interval. SIGTERM must
#      reach the process and be allowed to flush, checkpoint and release the
#      lock before the container is killed. Docker's default 10s is tight
#      against a 5s flush plus a 300s checkpoint on a busy filesystem.
#   4. `restart: unless-stopped` is the recovery half of WQN-2: the loop
#      watchdog (default 120s) exits the process when the main loop goes
#      silent - a heartbeat the probe can *see* - and this policy turns that
#      exit into an automatic restart. Docker does not restart an
#      unhealthy-but-running container on its own; see docs/... §8.2.

# Image tags: this stack runs a **pinned immutable SHA**, never `stable`.
#
# `stable` is a mutable pointer that .github/workflows/release.yml moves the
# moment a collector release passes its gates. Tracking it means the next
# `docker compose pull` - or one click on Unraid's "Check for updates" - adopts
# whatever was released most recently, with nobody having chosen that version.
# Pinning the SHA makes "which build is running" a property of this file, and
# makes rolling back a one-line .env edit rather than a hunt through the
# registry (see docs/release-rollback.md).
#
# One variable, in the stack's .env:
#
#   COLLECTOR_SHA   <full commit sha>   e.g. 5410c75d584771b4477de07f4b1d7b83b764bfe1
#
# The image is `sha-${COLLECTOR_SHA}`, and GIT_SHA / IMAGE_TAG are read from
# the same value, so the engine cannot report a different build from the one it
# is running.
x-common: &common
  # Published by .github/workflows/release.yml as sha-<full commit sha>, an
  # immutable tag. Compose refuses to start while COLLECTOR_SHA is unset,
  # rather than silently falling back to a floating tag.
  image: ghcr.io/aorulola/weatherquant-next:sha-${COLLECTOR_SHA:?set COLLECTOR_SHA in the stack .env to the released commit}
  container_name: weatherquant-collector
  restart: unless-stopped
  stop_grace_period: 60s
  user: "1000:1000"
  # The container's own memory ceiling, matched to DuckDB's in-process budget
  # (WQ_DUCKDB_MEMORY_LIMIT=3GB below): the budget bounds the engine, but not
  # Python or native allocations, and `memory_limit` spills rather than fails.
  # 6 GB is the hard cap: hitting it means the kernel OOM-kills THIS container
  # alone instead of starving the whole host - which a 16 GB, no-swap Unraid
  # box shared with a Shadow and a KVM guest cannot survive again.
  # mem_limit == memswap_limit means no swap beyond the limit: a container that
  # goes past 6 GB is killed, not paged to an array disk.
  mem_limit: 6g
  memswap_limit: 6g
  environment:
    TZ: UTC
    WQ_DB_PATH: /data/weatherquant.duckdb
    WQ_RAW_DIR: /data/raw
    WQ_LOG_LEVEL: INFO
    # The engine's in-process budget. Must stay well under the container's 6 GB
    # ceiling so spill, Python and native allocations all have room.
    WQ_DUCKDB_MEMORY_LIMIT: 3GB
    WQ_DUCKDB_THREADS: "4"
    # Where DuckDB spills when a query exceeds the budget. Under /data (the NAS
    # array), never tmpfs: a tmpfs spill IS a memory allocation and would defeat
    # the budget it exists to enforce.
    WQ_DUCKDB_TEMP_DIR: /data/duckdb-spill
    # Build provenance, stamped by CI. Shown in the heartbeat and in
    # collector_runs so "which version produced this row?" is always answerable.
    # Both come from the same value the image tag is built from, so the engine
    # cannot report a build other than the one it is running.
    GIT_SHA: ${COLLECTOR_SHA:?set COLLECTOR_SHA in the stack .env to the released commit}
    IMAGE_TAG: ${COLLECTOR_SHA:?set COLLECTOR_SHA in the stack .env to the released commit}
  volumes:
    - /mnt/user/appdata/weatherquant-next:/data
  healthcheck:
    test: ["CMD", "python", "/usr/local/bin/healthcheck.py"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 90s
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  collector:
    <<: *common

# Backups are performed *by the collector itself* (see
# docs/unraid-collector-deployment.md §9): the database file is locked for the
# writer's whole life, so an external process cannot take a consistent copy of
# it. Since WQN-1 the copy runs on a background thread with its own connection
# to the same in-process DuckDB instance: collection, heartbeats and the
# health probe keep running while a multi-gigabyte backup crawls over FUSE.
# A copy that exceeds --backup-timeout-seconds (default 1800) is abandoned and
# the half-written .incomplete- file is discarded, never published.
#
# Moving that copy off the NAS is a separate schedule - see §9.3 in the guide.
