# WeatherQuant Next - Paper engine, Unraid Compose Manager Plus stack
#
# Paper has its own image, data directory, database, lock and release tags.
# The collector and Shadow remain independent and keep collecting while Paper
# is stopped. Their published inputs are mounted READ-ONLY; neither database
# directory is mounted at all.
#
# Required stack .env values:
#   PAPER_SHA       full released commit SHA (the immutable rollback target)
#   PAPER_API_LAN_IP  the NAS's own LAN address, e.g. 192.168.1.20
# Optional:
#   WQ_PAPER_ENABLED=false  (must be changed deliberately to true before init)
#
# The read-only API is published only on PAPER_API_LAN_IP, never on all host
# interfaces. There is no trade endpoint and no wallet or signing capability.

x-common: &common
  image: ghcr.io/aorulola/weatherquant-next-paper:sha-${PAPER_SHA:?set PAPER_SHA in the stack .env to the released commit}
  container_name: weatherquant-paper
  restart: unless-stopped
  stop_grace_period: 60s
  user: "1000:1000"
  security_opt:
    - no-new-privileges:true
  environment:
    TZ: UTC
    WQ_PAPER_ENABLED: ${WQ_PAPER_ENABLED:-false}
    WQ_PAPER_DB_PATH: /data/paper/paper.duckdb
    WQ_PAPER_HEALTH_DIR: /data/health
    WQ_PAPER_EVENTS_DIR: /shadow-decisions
    WQ_PAPER_RAW_DIR: /collector-raw
    WQ_PAPER_RISK_RULES_PATH: /app/configs/paper-risk.json
    # The process must listen inside the container for Docker's explicit LAN
    # address publication below. The host does not listen on 0.0.0.0.
    WQ_PAPER_API_HOST: 0.0.0.0
    WQ_PAPER_API_PORT: 8790
    WQ_LOG_LEVEL: INFO
    GIT_SHA: ${PAPER_SHA:?set PAPER_SHA in the stack .env to the released commit}
    IMAGE_TAG: ${PAPER_SHA:?set PAPER_SHA in the stack .env to the released commit}
    WQ_DUCKDB_MEMORY_LIMIT: ${WQ_DUCKDB_MEMORY_LIMIT:-1GB}
    WQ_DUCKDB_TEMP_DIR: ${WQ_DUCKDB_TEMP_DIR:-/data/tmp}
  ports:
    # Required so the host never exposes the read-only API on every interface.
    - "${PAPER_API_LAN_IP:?set PAPER_API_LAN_IP to the NAS LAN address}:8790:8790"
  mem_limit: 2g
  memswap_limit: 2g
  cpus: 1.0
  volumes:
    # Paper's own writable state: paper.duckdb, health and temporary files.
    - /mnt/user/appdata/weatherquant-paper:/data
    # Shadow's published decision channel only; Shadow's database is absent.
    - /mnt/user/appdata/weatherquant-shadow/reports/decisions-export:/shadow-decisions:ro
    # Collector raw JSONL only; its database and database directory are absent.
    - /mnt/user/appdata/weatherquant-next/raw:/collector-raw:ro
  healthcheck:
    test: ["CMD", "python", "/usr/local/bin/healthcheck.py"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 60s
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  paper:
    <<: *common

# One replica only: .paper.lock refuses a second writer with exit code 4.
# Stop Paper at any time without stopping or restarting collector or Shadow.
